<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin DixonMyaz</title><link rel="stylesheet" href="/style.css"></head><body><header class="top"><a class="brand" href="/"><b>D</b><span>DixonMyaz<small>ADMIN CENTER</small></span></a><a href="/">← Lihat toko</a></header><main class="products"><section id="loginBox" class="modal show" style="display:block;position:static;transform:none;margin:45px auto"><small class="eyebrow">DIXONMYAZ ADMIN</small><h2>Masuk admin</h2><form id="loginForm"><input name="password" type="password" placeholder="Password admin" required><button class="btn">Masuk</button></form><p id="loginError" class="error"></p></section><section id="panel" hidden><div class="head"><div><small class="eyebrow">STORE MANAGEMENT</small><h2>Admin Center</h2></div><button id="logout" class="btn">Keluar</button></div><div class="story" style="display:block;padding:25px;margin-bottom:28px"><h2>Tambah produk</h2><form id="productForm" class="admin-form"><input name="name" placeholder="Nama produk" required><select name="category"><option value="brownies">Brownies</option><option value="kerupuk">Kerupuk</option></select><input name="price" type="number" min="1" placeholder="Harga (Rupiah)" required><input name="stock" type="number" min="0" placeholder="Stok" required><input name="unit" placeholder="Satuan, contoh: 1 box"><input name="image_url" type="url" placeholder="URL foto produk"><textarea name="description" placeholder="Deskripsi"></textarea><button class="btn">Simpan produk</button></form><p id="productMessage"></p></div><h2>Daftar produk</h2><div id="adminProducts" class="grid"></div><h2 style="margin-top:55px">Pesanan masuk</h2><div id="adminOrders"></div></section></main><script src="/admin.js" defer></script></body></html>
